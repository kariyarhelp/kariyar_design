<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kariyar · Story video (embed)</title>
<link rel="icon" type="image/svg+xml" href="brand/kariyar-icon.svg">
<link rel="stylesheet" href="ds/fonts.css">
<link rel="stylesheet" href="ds/colors.css">
<link rel="stylesheet" href="ds/typography.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>html,body{margin:0;height:100%;background:#0f0f35;font-family:var(--font-inter);overflow:hidden}a{color:#408fed}a:hover{color:#3e1bc9}#root{height:100%}
/* embed: hide the engine's playback bar and badges, keep the stage full-bleed */
#root>div>*:not(:first-child){display:none!important}#root>div>div:first-child{height:100%!important}</style>
<script>window.OM_SCENES = '[{"name":"Opening","dur":6},{"name":"Entry","dur":8},{"name":"Talk","dur":10},{"name":"Responder","dur":10},{"name":"Referral","dur":8},{"name":"Visit","dur":10},{"name":"Close","dur":8}]';</script>
<script>window.OM_PLAYBACK = '{"mode":"loop"}';</script>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="video/animations-v3.jsx"></script>
<script type="text/babel" src="video/kv-parts.jsx"></script>
<script type="text/babel" src="video/kv-scenes.jsx"></script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(
  <CompositionStage width={1920} height={1080} bg="#0f0f35" scenes={window.OM_SCENES} playback={window.OM_PLAYBACK}><KariyarStory /></CompositionStage>
);
</script>
</body>
</html>
